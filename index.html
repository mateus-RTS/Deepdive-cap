<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTS Partners · Captação</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#1A1A1B;--green:#3D754E;--gl:#5a9e6f;--gl2:#a3d9b1;--ow:#F9F5EF;
  --gray:#2e2e2f;--gray2:#3d3d3e;--muted:#a0a0a0;--border:rgba(255,255,255,0.08);
  --warn:#f0b429;--danger:#f87171;--info:#60a5fa;
}
body{font-family:'Ubuntu',sans-serif;background:var(--black);color:var(--ow);min-height:100vh;}

/* NAV */
.nav{background:#111112;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.5rem;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:100;}
.nav-brand{display:flex;align-items:center;gap:10px;padding:10px 0;margin-right:1.5rem;flex-shrink:0;}
.brand-logo{width:28px;height:28px;}
.brand-name{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;color:#fff;letter-spacing:.05em;line-height:1.2;}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:.06em;margin-top:1px;}
.tab{font-size:12px;font-weight:500;padding:14px 16px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.tab:hover{color:var(--ow);}
.tab.active{color:#fff;border-bottom-color:var(--green);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.period-badge{font-size:11px;background:var(--green);color:#fff;border-radius:4px;padding:3px 10px;font-weight:500;}
.sub-badge{font-size:10px;color:var(--muted);background:rgba(255,255,255,0.06);border-radius:4px;padding:3px 8px;}

/* LAYOUT */
.page{display:none;padding:1.5rem;max-width:1300px;margin:0 auto;}
.page.active{display:block;}
.section-title{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;}
.section-sub{font-size:11px;color:var(--muted);margin-bottom:1rem;font-weight:300;}
.gbar{width:24px;height:3px;background:var(--green);border-radius:2px;margin-bottom:7px;}

/* CARDS */
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:1.25rem;}
@media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr);}}
@media(max-width:500px){.metrics{grid-template-columns:repeat(2,1fr);}}
.mc{background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:1rem;}
.mc-label{font-size:10px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:300;}
.mc-value{font-size:20px;font-weight:500;color:var(--ow);}
.mc-note{font-size:11px;margin-top:4px;color:var(--muted);}
.mc-up .mc-value{color:var(--gl);}
.mc-warn .mc-value,.mc-warn .mc-note{color:var(--warn);}
.mc-down .mc-value{color:var(--danger);}
.card{background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:1.1rem;margin-bottom:12px;}

/* PACE BARS */
.banker-row{margin-bottom:1rem;}
.banker-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px;}
.banker-name{font-size:13px;font-weight:500;color:var(--ow);}
.banker-vals{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.bv{font-size:11px;color:var(--muted);}
.bv strong{color:var(--ow);font-weight:500;}
.pace-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px;}
.p-ok{background:rgba(90,158,111,.2);color:var(--gl);}
.p-warn{background:rgba(240,180,41,.18);color:var(--warn);}
.p-low{background:rgba(248,113,113,.15);color:var(--danger);}
.bar-outer{position:relative;height:26px;margin-bottom:3px;}
.bar-track{height:100%;background:rgba(255,255,255,0.05);border-radius:6px;overflow:hidden;display:flex;}
.seg-jan{height:100%;background:var(--gl);}
.seg-fev{height:100%;background:#3D754E;}
.seg-neg{height:100%;background:rgba(248,113,113,0.6);}
.marker{position:absolute;top:-3px;width:2px;border-radius:2px;height:calc(100% + 6px);}
.m-pace{background:var(--warn);}
.m-meta{background:rgba(255,255,255,0.18);}
.m-label{position:absolute;top:-16px;font-size:9px;white-space:nowrap;transform:translateX(-50%);font-weight:500;}
.bar-sub{display:flex;justify-content:space-between;margin-top:3px;}
.bar-pct{font-size:10px;color:var(--muted);}
.pace-divider{height:1px;background:var(--border);margin:.75rem 0;}
.total-block{background:rgba(61,117,78,0.1);border:1px solid rgba(61,117,78,0.22);border-radius:6px;padding:.85rem 1rem;}

/* PROG BARS */
.prog-wrap{margin-bottom:8px;}
.prog-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.prog-name{font-size:12px;color:var(--ow);font-weight:500;}
.prog-val{font-size:11px;color:var(--muted);}
.prog-bar{background:var(--gray2);border-radius:4px;height:7px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:var(--green);}
.prog-fill.low{background:var(--danger);}
.prog-fill.mid{background:var(--warn);}

/* FILTERS */
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:11px;color:var(--muted);margin-right:4px;}
.fbtn{font-size:11px;padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--muted);font-family:'Ubuntu',sans-serif;transition:all .15s;}
.fbtn:hover{color:var(--ow);border-color:rgba(255,255,255,0.2);}
.fbtn.active{color:#fff;border-color:var(--green);font-weight:500;}
.fbtn.dn.active{background:#2563eb;border-color:#2563eb;}
.fbtn.mj.active{background:#7c3aed;border-color:#7c3aed;}
.fbtn.nc.active{background:#16a34a;border-color:#16a34a;}
.fbtn.ri.active{background:#ea580c;border-color:#ea580c;}
.fbtn.todos.active{background:var(--green);border-color:var(--green);}
.sep{width:1px;height:20px;background:var(--border);}

/* TABLE */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:7px 10px;color:var(--muted);font-weight:400;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
th:not(:first-child):not(:nth-child(2)){text-align:right;}
td{padding:6px 10px;color:var(--ow);border-bottom:1px solid rgba(255,255,255,0.04);white-space:nowrap;}
td:not(:first-child):not(:nth-child(2)){text-align:right;}
tr:last-child td{border-bottom:none;}
tr.tr-tot td{color:var(--gl);font-weight:500;border-top:1px solid var(--green);}
tr.neg td.cap{color:var(--danger);}
.badge-new{font-size:9px;padding:1px 6px;border-radius:99px;background:rgba(240,180,41,.18);color:var(--warn);font-weight:500;margin-left:4px;}
.badge-old{font-size:9px;padding:1px 6px;border-radius:99px;background:rgba(90,158,111,.15);color:var(--gl);font-weight:500;margin-left:4px;}
.bk-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;flex-shrink:0;}

/* NOTE */
.note{font-size:11px;color:var(--muted);border-left:2px solid var(--green);padding:5px 10px;margin-top:10px;line-height:1.6;}
.warn-note{font-size:11px;color:var(--warn);border-left:2px solid var(--warn);padding:5px 10px;margin-top:10px;line-height:1.6;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.li{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);}
.ld{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.ld-line{width:14px;height:2px;border-radius:2px;flex-shrink:0;}

/* GRID */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:700px){.row2{grid-template-columns:1fr;}}
</style>
</head>

function ss(obj){return obj?onCols.reduce((a,c)=>a+(obj[c]||0),0):0;}
function buildIdx(arr){const m={};arr.forEach(r=>{if(!m[r.id])m[r.id]={btg:0,xp:0,itau:0,brad:0,sant:0,safra:0,day:0};onCols.forEach(c=>m[r.id][c]+=(r[c]||0));});return m;}

const idxDez=buildIdx(aumDez),idxJan=buildIdx(aumJan),idxFev=buildIdx(aumFev);
const idxRJ=buildIdx(retJan),idxRF=buildIdx(retFev);
const idsDez=new Set(aumDez.map(r=>r.id)),idsJan=new Set(aumJan.map(r=>r.id));
const allIDs=[...new Set([...aumDez,...aumJan,...aumFev].map(r=>r.id))].filter(id=>metaMap[id]);

// Por ID → captação jan e fev
const capIDs=allIDs.map(id=>{
  const m=metaMap[id];
  const dez=ss(idxDez[id]),jan=ss(idxJan[id]),fev=ss(idxFev[id]);
  const rj=ss(idxRJ[id]),rf=ss(idxRF[id]);
  const newJan=!idsDez.has(id)&&idsJan.has(id);
  const newFev=!idsJan.has(id)&&fev>0;
  const cj=newJan?jan:(jan-dez-rj);
  const cf=newFev?fev:(fev-jan-rf);
  return{id,b:m.b,c:m.c,cj,cf,ytd:cj+cf,newJan,newFev,dez,jan,fev};
});

// Agregar por cliente (banker+cod)
const clientMap={};
capIDs.forEach(r=>{
  const k=r.b+'|'+r.c;
  if(!clientMap[k])clientMap[k]={b:r.b,c:r.c,cj:0,cf:0,ytd:0,dez:0,jan:0,fev:0,newJan:false,newFev:false};
  clientMap[k].cj+=r.cj; clientMap[k].cf+=r.cf; clientMap[k].ytd+=r.ytd;
  clientMap[k].dez+=r.dez; clientMap[k].jan+=r.jan; clientMap[k].fev+=r.fev;
  if(r.newJan)clientMap[k].newJan=true;
  if(r.newFev)clientMap[k].newFev=true;
});
const clients=Object.values(clientMap);

// Agregar por banker
const bkMap={};
BANKERS.forEach(b=>{bkMap[b]={jan:0,fev:0,ytd:0,newJan:0,newFev:0,oldJan:0,oldFev:0};});
clients.forEach(r=>{
  bkMap[r.b].jan+=r.cj; bkMap[r.b].fev+=r.cf; bkMap[r.b].ytd+=r.ytd;
  if(r.newJan)bkMap[r.b].newJan+=r.cj; else bkMap[r.b].oldJan+=r.cj;
  if(r.newFev)bkMap[r.b].newFev+=r.cf; else bkMap[r.b].oldFev+=r.cf;
});

const totJan=BANKERS.reduce((s,b)=>s+bkMap[b].jan,0);
const totFev=BANKERS.reduce((s,b)=>s+bkMap[b].fev,0);
const totYTD=totJan+totFev;
const paceAnual=(totYTD/N_MESES)*MESES_ANO;
const falta=Math.max(0,META_TOTAL-totYTD);

function filteredClients(){
  let d=[...clients];
  if(filterBk!=='TODOS')d=d.filter(r=>r.b===filterBk);
  if(filterTipo==='NOVO')d=d.filter(r=>r.newJan||r.newFev);
  if(filterTipo==='ANTIGO')d=d.filter(r=>!r.newJan&&!r.newFev);
  d.sort((a,b)=>sortDir*(a[sortCol]-b[sortCol]));
  return d;
}

// ── RENDER PACE ──────────────────────────────────────────────────────────────
function renderPace(){
  const ytdPct=(totYTD/META_TOTAL)*100;
  const metricsHTML=[
    {cls:'mc-up',    label:'Captação YTD',     value:fmtM(totYTD),                note:'Jan + Fev 2026'},
    {cls:'',         label:'% da Meta R$400MM', value:ytdPct.toFixed(1)+'%',      note:'2 meses de 12'},
    {cls:'mc-up',    label:'Captação Jan',      value:fmtM(totJan),               note:'1º mês completo'},
    {cls:'mc-up',    label:'Captação Fev',      value:fmtM(totFev),               note:'2º mês completo'},
    {cls:'mc-warn',  label:'Falta captar',      value:fmtM(falta),                note:'Meta R$400MM'},
    {cls:paceAnual>=META_TOTAL?'mc-up':'mc-warn',label:'Pace anual',value:fmtM(paceAnual,0),note:paceAnual>=META_TOTAL?'✓ Acima da meta':'⚠ Abaixo da meta'},
  ].map(m=>`<div class="mc ${m.cls}"><div class="mc-label">${m.label}</div><div class="mc-value">${m.value}</div><div class="mc-note">${m.note}</div></div>`).join('');

  // barra geral
  const totalBarHTML=`
  <div class="total-block" style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
      <div>
        <div style="font-size:12px;font-weight:500;color:var(--gl);">Total RTS — 4 Bankers</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;">Meta: R$400MM · Pace: ${fmtM(paceAnual,0)} · Falta: ${fmtM(falta)}</div>
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        <div style="text-align:right;"><div style="font-size:10px;color:var(--muted);">Jan</div><div style="font-size:14px;font-weight:500;color:var(--gl);">${fmtM(totJan)}</div></div>
        <div style="text-align:right;"><div style="font-size:10px;color:var(--muted);">Fev</div><div style="font-size:14px;font-weight:500;color:#3D754E;">${fmtM(totFev)}</div></div>
        <div style="text-align:right;"><div style="font-size:10px;color:var(--muted);">YTD</div><div style="font-size:16px;font-weight:500;color:var(--gl);">${fmtM(totYTD)}</div></div>
      </div>
    </div>
    <div style="background:rgba(255,255,255,0.05);border-radius:6px;height:14px;overflow:hidden;display:flex;position:relative;">
      <div style="height:100%;background:var(--gl);width:${Math.max(0,totJan/META_TOTAL*100).toFixed(2)}%;"></div>
      <div style="height:100%;background:#3D754E;width:${Math.max(0,totFev/META_TOTAL*100).toFixed(2)}%;"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:4px;">
      <span style="font-size:10px;color:var(--gl);">${ytdPct.toFixed(1)}% concluído</span>
      <span style="font-size:10px;color:var(--warn);">Pace ${fmtM(paceAnual,0)} de ${fmtM(META_TOTAL,0)}</span>
    </div>
  </div>`;

  // bankers
  const bankersHTML=BANKERS.map(b=>{
    const d=bkMap[b];
    const ytd=d.ytd;
    const pace=(ytd/N_MESES)*MESES_ANO;
    const pacePct=(pace/META_BANKER)*100;
    const ytdPctB=(ytd/META_BANKER)*100;
    const paceEspPct=(N_MESES/MESES_ANO)*100;
    const janW=Math.max(0,d.jan/META_BANKER*100).toFixed(2)+'%';
    const fevW=Math.max(0,d.fev/META_BANKER*100).toFixed(2)+'%';
    const bc=badgeCls(pacePct);
    return`<div class="banker-row">
      <div class="banker-top">
        <span class="banker-name">${bkDot(b)}${BK_NAMES[b]}</span>
        <div class="banker-vals">
          <span class="bv">Jan: <strong>${fmtM(d.jan)}</strong></span>
          <span class="bv">Fev: <strong>${fmtM(d.fev)}</strong></span>
          <span class="bv">YTD: <strong>${fmtM(ytd)}</strong></span>
          <span class="bv" style="color:var(--warn);">Novos: <strong>${fmtM(d.newJan+d.newFev)}</strong></span>
          <span class="bv" style="color:var(--gl);">Antigos: <strong>${fmtM(d.oldJan+d.oldFev)}</strong></span>
          <span class="pace-badge ${bc}">${pacePct.toFixed(0)}% do pace</span>
        </div>
      </div>
      <div class="bar-outer">
        <div class="bar-track">
          <div class="${d.jan<0?'seg-neg':'seg-jan'}" style="width:${janW}"></div>
          <div class="${d.fev<0?'seg-neg':'seg-fev'}" style="width:${fevW}"></div>
        </div>
        <div class="marker m-pace" style="left:${Math.min(99,paceEspPct).toFixed(1)}%;height:calc(100% + 6px);top:-3px;">
          <span class="m-label" style="color:var(--warn);">${fmtM(META_BANKER/MESES_ANO*N_MESES)}</span>
        </div>
        <div class="marker m-meta" style="left:99.5%;height:calc(100% + 6px);top:-3px;">
          <span class="m-label" style="color:#6b7280;">100MM</span>
        </div>
      </div>
      <div class="bar-sub">
        <span class="bar-pct"><strong style="color:var(--gl);">Jan ${fmtM(d.jan)}</strong> + <strong style="color:#3D754E;">Fev ${fmtM(d.fev)}</strong> = <strong>${fmtM(ytd)}</strong></span>
        <span class="bar-pct">Gap: <strong style="color:var(--ow);">${fmtM(Math.max(0,META_BANKER-ytd))}</strong></span>
      </div>
    </div>`;
  }).join('');

  // progresso
  const progHTML=BANKERS.map(b=>{
    const ytd=bkMap[b].ytd;
    const pct=Math.max(0,ytd/META_BANKER*100);
    const fc=pct>=50?'':(pct>=20?'mid':'low');
    return`<div class="prog-wrap"><div class="prog-label"><span class="prog-name">${bkDot(b)}${b}</span><span class="prog-val">${fmtM(ytd)} · ${pct.toFixed(1)}%</span></div><div class="prog-bar"><div class="prog-fill ${fc}" style="width:${Math.min(100,pct)}%"></div></div></div>`;
  }).join('');
  const totPct=(totYTD/META_TOTAL*100);
  const progTot=`<div class="prog-wrap" style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px;"><div class="prog-label"><span class="prog-name" style="color:var(--gl);">Total RTS</span><span class="prog-val" style="color:var(--gl);">${fmtM(totYTD)} · ${totPct.toFixed(1)}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${Math.min(100,totPct)}%;background:var(--gl);"></div></div></div>`;

  document.getElementById('page-pace').innerHTML=`
  <div class="metrics">${metricsHTML}</div>
  <div class="card">
    <div class="gbar"></div>
    <div class="section-title">Pace vs Meta Anual — R$100MM por Banker</div>
    <div class="section-sub">Δ Cap = AUM atual − AUM anterior − Retorno (onshore) · linha amarela = pace esperado (${N_MESES} meses) · meta = R$100MM</div>
    <div class="legend" style="margin-bottom:12px;">
      <span class="li"><span class="ld" style="background:var(--gl);"></span>Jan/26</span>
      <span class="li"><span class="ld" style="background:#3D754E;"></span>Fev/26</span>
      <span class="li"><span class="ld" style="background:rgba(248,113,113,0.6);"></span>Negativo</span>
      <span class="li"><div class="ld-line" style="background:var(--warn);"></div>Pace esperado</span>
      <span class="li"><div class="ld-line" style="background:rgba(255,255,255,0.2);"></div>Meta anual</span>
    </div>
    ${totalBarHTML}
    ${bankersHTML}
    <div class="pace-divider"></div>
    <div class="section-title" style="margin-bottom:8px;">Progresso individual vs R$100MM</div>
    ${progHTML}${progTot}
    <div class="note">RI e MJ aceleraram em fev — acima do pace esperado. DN e NC abaixo de 50% do pace: atenção redobrada nos próximos meses.</div>
  </div>`;
}

// ── RENDER CLIENTES ───────────────────────────────────────────────────────────
function renderClientes(){
  const d=filteredClients();
  const totCJ=d.reduce((s,r)=>s+r.cj,0);
  const totCF=d.reduce((s,r)=>s+r.cf,0);
  const totYTDf=d.reduce((s,r)=>s+r.ytd,0);

  const filtersHTML=`
  <div class="filters">
    <span class="filter-label">Banker:</span>
    ${['TODOS',...BANKERS].map(b=>`<button class="fbtn ${b.toLowerCase()} ${filterBk===b?'active':''}" onclick="setFilter('bk','${b}')">${b}</button>`).join('')}
    <div class="sep"></div>
    <span class="filter-label">Tipo:</span>
    ${['TODOS','NOVO','ANTIGO'].map(t=>`<button class="fbtn todos ${filterTipo===t?'active':''}" onclick="setFilter('tipo','${t}')">${t}</button>`).join('')}
  </div>`;

  const thSort=(col,label)=>{
    const active=sortCol===col;
    const arrow=active?(sortDir>0?'↑':'↓'):'';
    return`<th style="cursor:pointer;${active?'color:var(--ow);':''}" onclick="setSort('${col}')">${label} ${arrow}</th>`;
  };

  const rows=d.map((r,i)=>{
    const isNew=r.newJan||r.newFev;
    const badge=isNew?`<span class="badge-new">novo</span>`:`<span class="badge-old">antigo</span>`;
    return`<tr>
      <td>${bkDot(r.b)}${r.b}</td>
      <td style="font-weight:500;">${r.c}${badge}</td>
      <td>${fmtM(r.dez)}</td>
      <td>${fmtM(r.jan)}</td>
      <td>${fmtM(r.fev)}</td>
      <td style="color:${r.cj>=0?'var(--gl)':'var(--danger)'};">${fmtR(r.cj)}</td>
      <td style="color:${r.cf>=0?'var(--gl)':'var(--danger)'};">${fmtR(r.cf)}</td>
      <td style="font-weight:500;color:${r.ytd>=0?'var(--gl)':'var(--danger)'};" class="cap">${fmtR(r.ytd)}</td>
    </tr>`;
  }).join('');

  document.getElementById('page-clientes').innerHTML=`
  ${filtersHTML}
  <div class="card">
    <div class="gbar"></div>
    <div class="section-title">Captação por Cliente — YTD Jan + Fev 2026</div>
    <div class="section-sub">${d.length} clientes · Δ Cap = AUM atual − AUM anterior − Retorno · clique no cabeçalho para ordenar</div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            ${thSort('b','Banker')}
            ${thSort('c','Cliente')}
            ${thSort('dez','AUM Dez')}
            ${thSort('jan','AUM Jan')}
            ${thSort('fev','AUM Fev')}
            ${thSort('cj','Δ Jan')}
            ${thSort('cf','Δ Fev')}
            ${thSort('ytd','Δ YTD')}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr class="tr-tot">
            <td colspan="2">Total (${d.length} clientes)</td>
            <td>—</td><td>—</td><td>—</td>
            <td style="color:${totCJ>=0?'var(--gl)':'var(--danger)'};">${fmtR(totCJ)}</td>
            <td style="color:${totCF>=0?'var(--gl)':'var(--danger)'};">${fmtR(totCF)}</td>
            <td style="color:${totYTDf>=0?'var(--gl)':'var(--danger)'};">${fmtR(totYTDf)}</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>`;
}

// ── RENDER MENSAL ─────────────────────────────────────────────────────────────
function renderMensal(){
  const metricsHTML=[
    {cls:'mc-up',  label:'Captação Jan',   value:fmtM(totJan),  note:`${BANKERS.map(b=>b+' '+fmtM(bkMap[b].jan)).join(' · ')}`},
    {cls:'mc-up',  label:'Captação Fev',   value:fmtM(totFev),  note:`${BANKERS.map(b=>b+' '+fmtM(bkMap[b].fev)).join(' · ')}`},
    {cls:'',       label:'Var. Jan→Fev',   value:fmtM(totFev-totJan), note:((totFev-totJan)/Math.abs(totJan)*100).toFixed(1)+'% de variação'},
    {cls:'mc-up',  label:'Novos Jan',      value:fmtM(BANKERS.reduce((s,b)=>s+bkMap[b].newJan,0)), note:'Clientes que entraram em Jan'},
    {cls:'mc-up',  label:'Novos Fev',      value:fmtM(BANKERS.reduce((s,b)=>s+bkMap[b].newFev,0)), note:'Clientes que entraram em Fev'},
    {cls:'mc-warn',label:'Falta/Banker',   value:fmtM(Math.max(0,META_BANKER-totYTD/4)), note:'Média por banker'},
  ].map(m=>`<div class="mc ${m.cls}"><div class="mc-label">${m.label}</div><div class="mc-value">${m.value}</div><div class="mc-note">${m.note}</div></div>`).join('');

  // tabela jan vs fev por banker
  const bkRows=BANKERS.map(b=>{
    const d=bkMap[b];
    const varV=d.jan!==0?((d.fev-d.jan)/Math.abs(d.jan)*100):0;
    const varColor=varV>=0?'var(--gl)':'var(--danger)';
    return`<tr>
      <td>${bkDot(b)}${BK_NAMES[b]}</td>
      <td style="color:${d.jan>=0?'var(--gl)':'var(--danger)'};">${fmtR(d.jan)}</td>
      <td style="color:${d.newJan>=0?'var(--warn)':'var(--danger)'};">${fmtR(d.newJan)}</td>
      <td style="color:var(--gl);">${fmtR(d.oldJan)}</td>
      <td style="color:${d.fev>=0?'var(--gl)':'var(--danger)'};">${fmtR(d.fev)}</td>
      <td style="color:var(--warn);">${fmtR(d.newFev)}</td>
      <td style="color:var(--gl);">${fmtR(d.oldFev)}</td>
      <td style="color:${varColor};font-weight:500;">${varV>=0?'+':''}${varV.toFixed(1)}%</td>
      <td style="color:${d.ytd>=0?'var(--gl)':'var(--danger)'};">${fmtR(d.ytd)}</td>
    </tr>`;
  }).join('');

  const totNewJan=BANKERS.reduce((s,b)=>s+bkMap[b].newJan,0);
  const totOldJan=BANKERS.reduce((s,b)=>s+bkMap[b].oldJan,0);
  const totNewFev=BANKERS.reduce((s,b)=>s+bkMap[b].newFev,0);
  const totOldFev=BANKERS.reduce((s,b)=>s+bkMap[b].oldFev,0);
  const totVar=totJan!==0?((totFev-totJan)/Math.abs(totJan)*100):0;

  // top captadores jan e fev
  const topJan=[...clients].sort((a,b)=>b.cj-a.cj).slice(0,8);
  const topFev=[...clients].sort((a,b)=>b.cf-a.cf).slice(0,8);

  const topTable=(arr,campo)=>arr.map((r,i)=>`<tr>
    <td style="color:var(--muted);font-size:11px;">${i+1}</td>
    <td>${bkDot(r.b)}${r.b} · <strong>${r.c}</strong></td>
    <td style="color:${r[campo]>=0?'var(--gl)':'var(--danger)'};">${fmtR(r[campo])}</td>
    <td><span class="${r.newJan||r.newFev?'badge-new':'badge-old'}">${r.newJan||r.newFev?'novo':'antigo'}</span></td>
  </tr>`).join('');

  document.getElementById('page-mensal').innerHTML=`
  <div class="metrics">${metricsHTML}</div>
  <div class="card">
    <div class="gbar"></div>
    <div class="section-title">Jan vs Fev — Captação por Banker e Origem</div>
    <div class="section-sub">Comparativo mensal · Novos = clientes que não existiam no mês anterior · Antigos = base existente</div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Banker</th>
            <th colspan="3" style="text-align:center;border-left:1px solid var(--border);color:var(--gl);">Janeiro</th>
            <th colspan="3" style="text-align:center;border-left:1px solid var(--border);color:#3D754E;">Fevereiro</th>
            <th>Var.</th>
            <th>YTD</th>
          </tr>
          <tr>
            <th></th>
            <th style="border-left:1px solid var(--border);">Total</th>
            <th style="color:var(--warn);">Novos</th>
            <th>Antigos</th>
            <th style="border-left:1px solid var(--border);">Total</th>
            <th style="color:var(--warn);">Novos</th>
            <th>Antigos</th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody>${bkRows}</tbody>
        <tfoot>
          <tr class="tr-tot">
            <td>Total RTS</td>
            <td>${fmtR(totJan)}</td>
            <td style="color:var(--warn);">${fmtR(totNewJan)}</td>
            <td>${fmtR(totOldJan)}</td>
            <td>${fmtR(totFev)}</td>
            <td style="color:var(--warn);">${fmtR(totNewFev)}</td>
            <td>${fmtR(totOldFev)}</td>
            <td style="color:${totVar>=0?'var(--gl)':'var(--danger)'};">${totVar>=0?'+':''}${totVar.toFixed(1)}%</td>
            <td>${fmtR(totYTD)}</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
  <div class="row2">
    <div class="card">
      <div class="gbar"></div>
      <div class="section-title">Top 8 — Captação Janeiro</div>
      <div class="section-sub">Por cliente, ordenado por Δ Jan</div>
      <table>
        <thead><tr><th>#</th><th>Cliente</th><th>Δ Jan</th><th>Tipo</th></tr></thead>
        <tbody>${topTable(topJan,'cj')}</tbody>
      </table>
    </div>
    <div class="card">
      <div class="gbar"></div>
      <div class="section-title">Top 8 — Captação Fevereiro</div>
      <div class="section-sub">Por cliente, ordenado por Δ Fev</div>
      <table>
        <thead><tr><th>#</th><th>Cliente</th><th>Δ Fev</th><th>Tipo</th></tr></thead>
        <tbody>${topTable(topFev,'cf')}</tbody>
      </table>
    </div>
  </div>`;
}

// ── CONTROLES ────────────────────────────────────────────────────────────────
function setFilter(type,val){
  if(type==='bk')filterBk=val;
  else filterTipo=val;
  renderClientes();
}
function setSort(col){
  if(sortCol===col)sortDir*=-1;
  else{sortCol=col;sortDir=-1;}
  renderClientes();
}
function showTab(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='pace')renderPace();
  else if(id==='clientes')renderClientes();
  else if(id==='mensal')renderMensal();
}

// init
renderPace();
renderClientes();
renderMensal();
</script>
</body>
</html>
