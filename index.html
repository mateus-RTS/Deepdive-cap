<title>RTS Partners · Captação</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#1A1A1B;--green:#3D754E;--gl:#5a9e6f;--gl2:#a3d9b1;--ow:#F9F5EF;
  --gray:#2e2e2f;--gray2:#3d3d3e;--muted:#a0a0a0;--border:rgba(255,255,255,0.08);
  --warn:#f0b429;--danger:#f87171;--info:#60a5fa;
}
body{font-family:'Ubuntu',sans-serif;background:var(--black);color:var(--ow);min-height:100vh;}
.nav{background:#111112;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.5rem;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:100;}
.nav-brand{display:flex;align-items:center;gap:10px;padding:10px 0;margin-right:1.5rem;flex-shrink:0;}
.brand-logo{width:28px;height:28px;}
.brand-name{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;color:#fff;letter-spacing:.05em;line-height:1.2;}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:.06em;margin-top:1px;}
.tab{font-size:12px;font-weight:500;padding:14px 16px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.tab:hover{color:var(--ow);}
.tab.active{color:#fff;border-bottom-color:var(--green);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.period-badge{font-size:11px;background:var(--green);color:#fff;border-radius:4px;padding:3px 10px;font-weight:500;}
.sub-badge{font-size:10px;color:var(--muted);background:rgba(255,255,255,0.06);border-radius:4px;padding:3px 8px;}
.page{display:none;padding:1.5rem;max-width:1300px;margin:0 auto;}
.page.active{display:block;}
.section-title{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;}
.section-sub{font-size:11px;color:var(--muted);margin-bottom:1rem;font-weight:300;}
.gbar{width:24px;height:3px;background:var(--green);border-radius:2px;margin-bottom:7px;}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:1.25rem;}
@media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr);}}
@media(max-width:500px){.metrics{grid-template-columns:repeat(2,1fr);}}
.mc{background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:1rem;}
.mc-label{font-size:10px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:300;}
.mc-value{font-size:20px;font-weight:500;color:var(--ow);}
.mc-note{font-size:11px;margin-top:4px;color:var(--muted);}
.mc-up .mc-value{color:var(--gl);}
.mc-warn .mc-value,.mc-warn .mc-note{color:var(--warn);}
.mc-down .mc-value{color:var(--danger);}
.card{background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:1.1rem;margin-bottom:12px;}
.banker-row{margin-bottom:1rem;}
.banker-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px;}
.banker-name{font-size:13px;font-weight:500;color:var(--ow);}
.banker-vals{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.bv{font-size:11px;color:var(--muted);}
.bv strong{color:var(--ow);font-weight:500;}
.pace-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px;}
.p-ok{background:rgba(90,158,111,.2);color:var(--gl);}
.p-warn{background:rgba(240,180,41,.18);color:var(--warn);}
.p-low{background:rgba(248,113,113,.15);color:var(--danger);}
.bar-outer{position:relative;height:26px;margin-bottom:3px;}
.bar-track{height:100%;background:rgba(255,255,255,0.05);border-radius:6px;overflow:hidden;display:flex;}
.seg-jan{height:100%;background:var(--gl);}
.seg-fev{height:100%;background:#3D754E;}
.seg-mar{height:100%;background:#2a5236;}
.seg-neg{height:100%;background:rgba(248,113,113,0.6);}
.marker{position:absolute;top:-3px;width:2px;border-radius:2px;height:calc(100% + 6px);}
.m-pace{background:var(--warn);}
.m-meta{background:rgba(255,255,255,0.18);}
.m-label{position:absolute;top:-16px;font-size:9px;white-space:nowrap;transform:translateX(-50%);font-weight:500;}
.bar-sub{display:flex;justify-content:space-between;margin-top:3px;}
.bar-pct{font-size:10px;color:var(--muted);}
.pace-divider{height:1px;background:var(--border);margin:.75rem 0;}
.total-block{background:rgba(61,117,78,0.1);border:1px solid rgba(61,117,78,0.22);border-radius:6px;padding:.85rem 1rem;}
.prog-wrap{margin-bottom:8px;}
.prog-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.prog-name{font-size:12px;color:var(--ow);font-weight:500;}
.prog-val{font-size:11px;color:var(--muted);}
.prog-bar{background:var(--gray2);border-radius:4px;height:7px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:var(--green);}
.prog-fill.low{background:var(--danger);}
.prog-fill.mid{background:var(--warn);}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:11px;color:var(--muted);margin-right:4px;}
.fbtn{font-size:11px;padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--muted);font-family:'Ubuntu',sans-serif;transition:all .15s;}
.fbtn:hover{color:var(--ow);border-color:rgba(255,255,255,0.2);}
.fbtn.active{color:#fff;border-color:var(--green);font-weight:500;}
.fbtn.dn.active{background:#2563eb;border-color:#2563eb;}
.fbtn.mj.active{background:#7c3aed;border-color:#7c3aed;}
.fbtn.nc.active{background:#16a34a;border-color:#16a34a;}
.fbtn.ri.active{background:#ea580c;border-color:#ea580c;}
.fbtn.todos.active{background:var(--green);border-color:var(--green);}
.sep{width:1px;height:20px;background:var(--border);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:7px 10px;color:var(--muted);font-weight:400;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
th:not(:first-child):not(:nth-child(2)){text-align:right;}
td{padding:6px 10px;color:var(--ow);border-bottom:1px solid rgba(255,255,255,0.04);white-space:nowrap;}
td:not(:first-child):not(:nth-child(2)){text-align:right;}
tr:last-child td{border-bottom:none;}
tr.tr-tot td{color:var(--gl);font-weight:500;border-top:1px solid var(--green);}
tr.neg td.cap{color:var(--danger);}
.badge-new{font-size:9px;padding:1px 6px;border-radius:99px;background:rgba(240,180,41,.18);color:var(--warn);font-weight:500;margin-left:4px;}
.badge-old{font-size:9px;padding:1px 6px;border-radius:99px;background:rgba(90,158,111,.15);color:var(--gl);font-weight:500;margin-left:4px;}
.bk-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;flex-shrink:0;}
.note{font-size:11px;color:var(--muted);border-left:2px solid var(--green);padding:5px 10px;margin-top:10px;line-height:1.6;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.li{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);}
.ld{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.ld-line{width:14px;height:2px;border-radius:2px;flex-shrink:0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:700px){.row2{grid-template-columns:1fr;}}
</style>
</head>

function buildIdx(arr){
  const m={};
  arr.forEach(r=>{
    const rid=idAlias[r.id]||r.id;
    if(!m[rid])m[rid]={btg:0,xp:0,itau:0,brad:0,sant:0,safra:0,day:0};
    onCols.forEach(c=>m[rid][c]+=(r[c]||0));
  });
  return m;
}

const idxDez=buildIdx(aumDez),idxJan=buildIdx(aumJan),idxFev=buildIdx(aumFev),idxMar=buildIdx(aumMar);
const idxRJ=buildIdx(retJan),idxRF=buildIdx(retFev),idxRM=buildIdx(retMar);

const idsDez=new Set(aumDez.map(r=>r.id));
const idsJan=new Set(aumJan.map(r=>r.id));
const idsFev=new Set(aumFev.map(r=>r.id));

const allIDs=[...new Set([...aumDez,...aumJan,...aumFev,...retMar.map(r=>({id:r.id}))].map(r=>r.id))].filter(id=>metaMap[idAlias[id]||id]);

const capIDs=allIDs.map(id=>{
  const rid=idAlias[id]||id;
  const m=metaMap[rid];
  if(!m)return null;
  const dez=ssAll(idxDez[rid]),jan=ssAll(idxJan[rid]),fev=ssAll(idxFev[rid]),mar=ssAll(idxMar[rid]);
  const rjCob=ssCob(idxRJ[rid],rid),rfCob=ssCob(idxRF[rid],rid),rmCob=ssCob(idxRM[rid],rid);
  const dezCob=ssCob(idxDez[rid],rid),janCob=ssCob(idxJan[rid],rid),fevCob=ssCob(idxFev[rid],rid),marCob=ssCob(idxMar[rid],rid);

  const isForceOld=forceOldIDs.has(id);
  const isForceNewFev=forceNewFevIDs.has(id);
  const isForceNewMar=forceNewMarIDs.has(id);

  const newJan=!isForceOld&&!idsDez.has(id)&&idsJan.has(id);
  const newFev=!isForceOld&&!newJan&&(isForceNewFev||(!idsJan.has(id)&&fev>0));
  const newMar=!isForceOld&&!newJan&&!newFev&&isForceNewMar;

  let cj,cf,cm;
  // Ajuste de dolarização — neutraliza resgates que foram para offshore
  const dol=dolMap[rid]||{};
  if(newJan){cj=janCob;cf=fevCob-janCob+(dol.fev||0);cm=marCob-fevCob+(dol.mar||0);}
  else if(newFev){cj=janCob-dezCob-rjCob;cf=fevCob+(dol.fev||0);cm=marCob-fevCob-rmCob+(dol.mar||0);}
  else if(newMar){cj=janCob-dezCob-rjCob;cf=fevCob-janCob-rfCob+(dol.fev||0);cm=marCob+(dol.mar||0);}
  else{cj=janCob-dezCob-rjCob;cf=fevCob-janCob-rfCob+(dol.fev||0);cm=marCob-fevCob-rmCob+(dol.mar||0);}

  const dolFev=dol.fev||0, dolMar=dol.mar||0;
  return{id:rid,b:m.b,c:m.c,cj,cf,cm,ytd:cj+cf+cm,newJan,newFev,newMar,dez,jan,fev,mar,dolFev,dolMar,dolTot:dolFev+dolMar};
}).filter(Boolean);

  if(r.newJan)clientMap[k].newJan=true;

});

function fmtM(v,d=1){if(isNaN(v))return'-';const n=Math.abs(v)/1e6;const s='R$'+n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'MM';return v<0?`(${s})`:s;}
function fmtR(v){if(!v&&v!==0)return'-';const s='R$'+Math.abs(Math.round(v)).toLocaleString('pt-BR');return v<0?`(${s})`:s;}
function badgeCls(pct){return pct>=100?'p-ok':pct>=75?'p-warn':'p-low';}
function bkDot(b){return`<span class="bk-dot" style="background:${BK_COLORS[b]};"></span>`;}

let filterBk='TODOS',filterTipo='TODOS',sortCol='ytd',sortDir=-1;
function filteredClients(){
  let d=[...clients];
  if(filterBk!=='TODOS')d=d.filter(r=>r.b===filterBk);
  if(filterTipo==='NOVO')d=d.filter(r=>r.newJan||r.newFev||r.newMar);
  if(filterTipo==='ANTIGO')d=d.filter(r=>!r.newJan&&!r.newFev&&!r.newMar);
  d.sort((a,b)=>sortDir*(a[sortCol]-b[sortCol]));
  return d;
}

  }).join('');
  const totPct=totYTD/META_TOTAL*100;
  const progTot=`<div class="prog-wrap" style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px;"><div class="prog-label"><span class="prog-name" style="color:var(--gl);">Total RTS</span><span class="prog-val" style="color:var(--gl);">${fmtM(totYTD)} · ${totPct.toFixed(1)}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${Math.min(100,totPct)}%;background:var(--gl);"></div></div></div>`;

  document.getElementById('page-pace').innerHTML=`
  <div class="metrics">${metricsHTML}</div>
  <div class="card">
    <div class="gbar"></div>
    <div class="section-title">Pace vs Meta Anual — R$100MM por Banker</div>
    <div class="section-sub">Δ Cap = AUM cobrado atual − AUM cobrado anterior − Retorno cobrado · regra 3 meses para novos · meta = R$100MM/banker</div>
    <div class="legend" style="margin-bottom:12px;">
      <span class="li"><span class="ld" style="background:var(--gl);"></span>Jan/26</span>
      <span class="li"><span class="ld" style="background:#3D754E;"></span>Fev/26</span>
      <span class="li"><span class="ld" style="background:#2a5236;"></span>Mar/26</span>
      <span class="li"><span class="ld" style="background:rgba(248,113,113,0.6);"></span>Negativo</span>
      <span class="li"><div class="ld-line" style="background:var(--warn);"></div>Pace esperado</span>
      <span class="li"><div class="ld-line" style="background:rgba(255,255,255,0.2);"></div>Meta anual</span>
    </div>
    ${totalBarHTML}
    ${bankersHTML}
    <div class="pace-divider"></div>
    <div class="section-title" style="margin-bottom:8px;">Progresso individual vs R$100MM</div>
    ${progHTML}${progTot}
  </div>`;
}

function renderClientes(){
  const d=filteredClients();
  const totCJ=d.reduce((s,r)=>s+r.cj,0);
  const totCF=d.reduce((s,r)=>s+r.cf,0);
  const totCM=d.reduce((s,r)=>s+r.cm,0);
  const totYTDf=d.reduce((s,r)=>s+r.ytd,0);
  const totDolFev=d.reduce((s,r)=>s+(r.dolFev||0),0);
  const totDolMar=d.reduce((s,r)=>s+(r.dolMar||0),0);
  const totDol=totDolFev+totDolMar;
  const totDez=d.reduce((s,r)=>s+r.dez,0);
  const totJanAum=d.reduce((s,r)=>s+r.jan,0);
  const totFevAum=d.reduce((s,r)=>s+r.fev,0);
  const totMarAum=d.reduce((s,r)=>s+r.mar,0);

  const aumCheckHTML=`
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;">
    <div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:.85rem 1rem;">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">AUM Total Dez/25</div>
      <div style="font-size:18px;font-weight:500;color:var(--ow);">${fmtM(totDez)}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:3px;">${d.length} clientes</div>
    </div>
    <div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:.85rem 1rem;">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">AUM Total Jan/26</div>
      <div style="font-size:18px;font-weight:500;color:var(--ow);">${fmtM(totJanAum)}</div>
      <div style="font-size:10px;color:${totJanAum>=totDez?'var(--gl)':'var(--danger)'};margin-top:3px;">${totJanAum>=totDez?'▲':'▼'} ${fmtM(Math.abs(totJanAum-totDez))} vs Dez</div>
    </div>
    <div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:.85rem 1rem;">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">AUM Total Fev/26</div>
      <div style="font-size:18px;font-weight:500;color:var(--ow);">${fmtM(totFevAum)}</div>
      <div style="font-size:10px;color:${totFevAum>=totJanAum?'var(--gl)':'var(--danger)'};margin-top:3px;">${totFevAum>=totJanAum?'▲':'▼'} ${fmtM(Math.abs(totFevAum-totJanAum))} vs Jan</div>
    </div>
    <div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:.85rem 1rem;">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">AUM Total Mar/26</div>
      <div style="font-size:18px;font-weight:500;color:var(--ow);">${fmtM(totMarAum)}</div>
      <div style="font-size:10px;color:${totMarAum>=totFevAum?'var(--gl)':'var(--danger)'};margin-top:3px;">${totMarAum>=totFevAum?'▲':'▼'} ${fmtM(Math.abs(totMarAum-totFevAum))} vs Fev</div>
    </div>
  </div>`;

  const filtersHTML=`
  <div class="filters">
    <span class="filter-label">Banker:</span>
    ${['TODOS',...BANKERS].map(b=>`<button class="fbtn ${b.toLowerCase()} ${filterBk===b?'active':''}" onclick="setFilter('bk','${b}')">${b}</button>`).join('')}
    <div class="sep"></div>
    <span class="filter-label">Tipo:</span>
    ${['TODOS','NOVO','ANTIGO'].map(t=>`<button class="fbtn todos ${filterTipo===t?'active':''}" onclick="setFilter('tipo','${t}')">${t}</button>`).join('')}
  </div>`;

  const thSort=(col,label)=>{const active=sortCol===col;const arrow=active?(sortDir>0?'↑':'↓'):'';return`<th style="cursor:pointer;${active?'color:var(--ow);':''}" onclick="setSort('${col}')">${label} ${arrow}</th>`;};

  const rows=d.map(r=>{
    const isNew=r.newJan||r.newFev||r.newMar;
    const badge=isNew?`<span class="badge-new">novo</span>`:`<span class="badge-old">antigo</span>`;
    return`<tr>
      <td>${bkDot(r.b)}${r.b}</td>
      <td style="font-weight:500;">${r.c}${badge}</td>
      <td>${fmtM(r.dez)}</td>
      <td>${fmtM(r.jan)}</td>
      <td>${fmtM(r.fev)}</td>
      <td>${fmtM(r.mar)}</td>
      <td style="color:${r.cj>=0?'var(--gl)':'var(--danger)'};">${fmtR(r.cj)}</td>
      <td style="color:${r.cf>=0?'var(--gl)':'var(--danger)'};">${fmtR(r.cf)}</td>
      <td style="color:${r.cm>=0?'var(--gl)':'var(--danger)'};">${fmtR(r.cm)}</td>
      <td style="font-weight:500;color:${r.ytd>=0?'var(--gl)':'var(--danger)'};" class="cap">${fmtR(r.ytd)}</td>
      <td style="color:${r.dolTot>0?'var(--info)':'var(--muted)'};">${r.dolTot>0?fmtR(r.dolTot):'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('page-clientes').innerHTML=`
  ${filtersHTML}
  ${aumCheckHTML}
  <div class="card">
    <div class="gbar"></div>
    <div class="section-title">Captação por Cliente — 1T26 (Jan · Fev · Mar)</div>
    <div class="section-sub">${d.length} clientes · Δ Cap = AUM cobrado − Retorno cobrado · regra 3 meses p/ novos · clique no cabeçalho para ordenar</div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        ${thSort('b','Banker')}${thSort('c','Cliente')}
        ${thSort('dez','AUM Dez')}${thSort('jan','AUM Jan')}${thSort('fev','AUM Fev')}${thSort('mar','AUM Mar')}
        ${thSort('cj','Δ Jan')}${thSort('cf','Δ Fev')}${thSort('cm','Δ Mar')}${thSort('ytd','Δ 1T26')}${thSort('dolTot','Dol.')}
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="tr-tot">
        <td colspan="2">Total (${d.length} clientes)</td>
        <td>—</td><td>—</td><td>—</td><td>—</td>
        <td style="color:${totCJ>=0?'var(--gl)':'var(--danger)'};">${fmtR(totCJ)}</td>
        <td style="color:${totCF>=0?'var(--gl)':'var(--danger)'};">${fmtR(totCF)}</td>
        <td style="color:${totCM>=0?'var(--gl)':'var(--danger)'};">${fmtR(totCM)}</td>
        <td style="color:${totYTDf>=0?'var(--gl)':'var(--danger)'};">${fmtR(totYTDf)}</td>
        <td style="color:var(--info);">${fmtR(totDol)}</td>
      </tr></tfoot>
    </table></div>
  </div>`;
}

function renderMensal(){
  const metricsHTML=[
    {cls:'mc-up',label:'Captação Jan',value:fmtM(totJan),note:BANKERS.map(b=>b+' '+fmtM(bkMap[b].jan)).join(' · ')},
    {cls:totFev>=0?'mc-up':'mc-down',label:'Captação Fev',value:fmtM(totFev),note:BANKERS.map(b=>b+' '+fmtM(bkMap[b].fev)).join(' · ')},
    {cls:totMar>=0?'mc-up':'mc-down',label:'Captação Mar',value:fmtM(totMar),note:BANKERS.map(b=>b+' '+fmtM(bkMap[b].mar)).join(' · ')},
    {cls:'mc-up',label:'1T26 Total',value:fmtM(totYTD),note:'Janeiro + Fevereiro + Março'},
    {cls:'mc-warn',label:'Falta/Meta',value:fmtM(falta),note:'R$400MM − YTD'},
    {cls:paceAnual>=META_TOTAL?'mc-up':'mc-warn',label:'Pace anual',value:fmtM(paceAnual,0),note:paceAnual>=META_TOTAL?'✓ Acima':'⚠ Abaixo da meta'},
  ].map(m=>`<div class="mc ${m.cls}"><div class="mc-label">${m.label}</div><div class="mc-value">${m.value}</div><div class="mc-note">${m.note}</div></div>`).join('');

  const bkRows=BANKERS.map(b=>{
    const d=bkMap[b];
    return`<tr>
      <td>${bkDot(b)}${BK_NAMES[b]}</td>
      <td style="color:${d.jan>=0?'var(--gl)':'var(--danger)'};">${fmtR(d.jan)}</td>
      <td style="color:var(--warn);">${fmtR(d.newJan)}</td>
      <td>${fmtR(d.oldJan)}</td>
      <td style="color:${d.fev>=0?'var(--gl)':'var(--danger)'};">${fmtR(d.fev)}</td>
      <td style="color:var(--warn);">${fmtR(d.newFev)}</td>
      <td>${fmtR(d.oldFev)}</td>
      <td style="color:${d.mar>=0?'var(--gl)':'var(--danger)'};">${fmtR(d.mar)}</td>
      <td style="color:var(--warn);">${fmtR(d.newMar)}</td>
      <td>${fmtR(d.oldMar)}</td>
      <td style="color:${d.ytd>=0?'var(--gl)':'var(--danger)'};font-weight:500;">${fmtR(d.ytd)}</td>
    </tr>`;
  }).join('');

  const totNewJan=BANKERS.reduce((s,b)=>s+bkMap[b].newJan,0);
  const totOldJan=BANKERS.reduce((s,b)=>s+bkMap[b].oldJan,0);
  const totNewFev=BANKERS.reduce((s,b)=>s+bkMap[b].newFev,0);
  const totOldFev=BANKERS.reduce((s,b)=>s+bkMap[b].oldFev,0);
  const totNewMar=BANKERS.reduce((s,b)=>s+bkMap[b].newMar,0);
  const totOldMar=BANKERS.reduce((s,b)=>s+bkMap[b].oldMar,0);

  const top3=(campo)=>[...clients].sort((a,b)=>b[campo]-a[campo]).slice(0,8).map((r,i)=>`<tr>
    <td style="color:var(--muted);font-size:11px;">${i+1}</td>
    <td>${bkDot(r.b)}${r.b} · <strong>${r.c}</strong></td>
    <td style="color:${r[campo]>=0?'var(--gl)':'var(--danger)'};">${fmtR(r[campo])}</td>
    <td><span class="${r.newJan||r.newFev||r.newMar?'badge-new':'badge-old'}">${r.newJan||r.newFev||r.newMar?'novo':'antigo'}</span></td>
  </tr>`).join('');

  document.getElementById('page-mensal').innerHTML=`
  <div class="metrics">${metricsHTML}</div>
  <div class="card">
    <div class="gbar"></div>
    <div class="section-title">Jan · Fev · Mar — Captação por Banker e Origem</div>
    <div class="section-sub">Novos = clientes que não existiam no mês anterior · Antigos = base existente</div>
    <div class="tbl-wrap"><table>
      <thead>
        <tr>
          <th>Banker</th>
          <th colspan="3" style="text-align:center;border-left:1px solid var(--border);color:var(--gl);">Janeiro</th>
          <th colspan="3" style="text-align:center;border-left:1px solid var(--border);color:#3D754E;">Fevereiro</th>
          <th colspan="3" style="text-align:center;border-left:1px solid var(--border);color:#5a9e6f;">Março</th>
          <th>1T26</th>
        </tr>
        <tr>
          <th></th>
          <th style="border-left:1px solid var(--border);">Total</th><th style="color:var(--warn);">Novos</th><th>Antigos</th>
          <th style="border-left:1px solid var(--border);">Total</th><th style="color:var(--warn);">Novos</th><th>Antigos</th>
          <th style="border-left:1px solid var(--border);">Total</th><th style="color:var(--warn);">Novos</th><th>Antigos</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${bkRows}</tbody>
      <tfoot><tr class="tr-tot">
        <td>Total RTS</td>
        <td>${fmtR(totJan)}</td><td style="color:var(--warn);">${fmtR(totNewJan)}</td><td>${fmtR(totOldJan)}</td>
        <td>${fmtR(totFev)}</td><td style="color:var(--warn);">${fmtR(totNewFev)}</td><td>${fmtR(totOldFev)}</td>
        <td>${fmtR(totMar)}</td><td style="color:var(--warn);">${fmtR(totNewMar)}</td><td>${fmtR(totOldMar)}</td>
        <td>${fmtR(totYTD)}</td>
      </tr></tfoot>
    </table></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:0;">
    <div class="card"><div class="gbar"></div><div class="section-title">Top 8 — Janeiro</div>
    <table><thead><tr><th>#</th><th>Cliente</th><th>Δ Jan</th><th>Tipo</th></tr></thead><tbody>${top3('cj')}</tbody></table></div>
    <div class="card"><div class="gbar"></div><div class="section-title">Top 8 — Fevereiro</div>
    <table><thead><tr><th>#</th><th>Cliente</th><th>Δ Fev</th><th>Tipo</th></tr></thead><tbody>${top3('cf')}</tbody></table></div>
    <div class="card"><div class="gbar"></div><div class="section-title">Top 8 — Março</div>
    <table><thead><tr><th>#</th><th>Cliente</th><th>Δ Mar</th><th>Tipo</th></tr></thead><tbody>${top3('cm')}</tbody></table></div>
  </div>`;
}

function setFilter(type,val){if(type==='bk')filterBk=val;else filterTipo=val;renderClientes();}
function setSort(col){if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=-1;}renderClientes();}
function showTab(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='pace')renderPace();
  else if(id==='clientes')renderClientes();
  else if(id==='mensal')renderMensal();
}

renderPace();renderClientes();renderMensal();
</script>
</body>
</html>
